<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>TopNavigation Transition</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (Figma variables) ---------- */
:root {
  color-scheme: light;               /* the design is light-only */
  --surface-primary: #ffffff;
  --surface-secondary: #f5f5f5;
  --border-secondary: #d6d6d6;
  --content-primary: #000000;
  --content-secondary: #525252;
  --content-tertiary: #737373;
  --placeholder-block: #f5f5f5;
  /* Action/Outline inner shadow painted OVER the 1px inside stroke (Figma order) */
  --outline: inset 0 4px 8px rgba(255,255,255,.7), inset 0 0 0 1px var(--border-secondary);
  --safe-top: env(safe-area-inset-top, 0px);
  box-sizing: border-box;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: light; }   /* keep the light design */
}
:root[data-theme="dark"] { color-scheme: light; }
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(68px + var(--safe-top)); }
body {
  margin: 0;
  background: var(--surface-primary);
  font-family: "Digikala", "Vazirmatn", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- Page content: native document scroll (touch) ---------- */
.feed {
  max-width: 480px; margin: 0 auto;
  padding: calc(132px + var(--safe-top)) 16px 32px;
  display: grid; gap: 12px;
}
.card { height: 160px; background: var(--placeholder-block); }
.card.short { height: 96px; }

/* =====================================================================
   TopNavigation — homePage ⇄ homePageScroll, driven by page scroll.
   No JavaScript. No status bar. No corner radius.
   Geometry = Figma minus the 44px status bar, with 12px top padding:
     expanded : field y12 h52 · location text y76 · header 132
     collapsed: circle y14 44×44 · location text y12 · header 68
   The collapse is scrubbed by the first 64px of scroll (1:1 with the
   content), using CSS scroll-driven animations. Every animated property is
   transform or opacity, so Chrome runs it on the compositor thread:
   no style, layout or paint per frame, smooth on low-end phones.
   ===================================================================== */
.tn {
  position: fixed; top: 0; left: 0; right: 0;
  margin: 0 auto; max-width: 480px;
  height: calc(132px + var(--safe-top));
  container-type: inline-size;        /* W (field width) = 100cqw − 32px */
  contain: layout style paint;
  pointer-events: none;
  z-index: 10;
}
.tn-in { position: absolute; left: 0; right: 0; top: var(--safe-top); height: 132px; }
.tn button { pointer-events: auto; touch-action: manipulation; }

/* White backdrop. Tall so it also covers the notch area; slides up 64px. */
.tn-bg {
  position: absolute; left: 0; right: 0; bottom: 0; height: 600px;
  background: var(--surface-primary);
  pointer-events: auto;
}

/* Location (homePage x24 right, y76) */
.tn-location { position: absolute; left: 0; right: 0; top: 76px; height: 56px; }
.tn-loc-frame {
  position: absolute; right: 24px; left: 64px; top: 0; height: 48px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
  direction: rtl; pointer-events: auto;
}
.tn-loc-label {
  width: 100%; font-size: 13px; line-height: 20px; font-weight: 400; color: var(--content-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right;
}
.tn-address { width: 100%; height: 24px; display: flex; align-items: center; gap: 8px; direction: rtl; }
.tn-address-text {
  font-size: 15px; line-height: 24px; font-weight: 700; color: var(--content-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tn-chip {
  flex: none; width: 20px; height: 20px; border-radius: 16px; background: rgba(0,0,0,.12);
  display: grid; place-items: center; border: 0; padding: 0; cursor: pointer;
}
.tn-chip svg { width: 18px; height: 18px; display: block; }

/* ---- Exact statics (shown only at the two rest points) ---- */
.tn-field, .tn-circle { position: absolute; left: 16px; border-radius: 999px; background: var(--surface-secondary); box-shadow: var(--outline); }
.tn-field  { top: 12px; width: calc(100cqw - 32px); height: 52px; }
/* Button — ghost / medium / circle (41:464) */
.tn-circle { top: 14px; width: 44px; height: 44px; opacity: 0; }

/* ---- Rig (visible only between the rest points) ----
   Three moving layers, NO overflow clipping, NO pseudo-elements, NO opacity group:
   .rig-l / .rig-r : 52px circles (field ends), uniform scale s (1 → 44/52).
                     Each shows only its outer HALF (clip-path painted inside
                     the layer), so their inner arcs never show when they meet.
   .rig-band       : flat rectangle between the two circle CENTRES; scaleX
                     shrinks it to 0 as the halves meet.
   Left half + band + right half tile the pill exactly at the centre lines.
   The band uses a vertical gradient sampled from the real fill +
   Action/Outline inner shadow + 1px stroke, so it has no side edges.
   Why: the black edge came from a clipping layer (overflow:hidden) holding
   moving content inside an opacity-animated parent. Mobile Safari and some
   Chrome GPU paths never cleared the uncovered corners of that layer, so
   they showed BLACK. There is no clip layer and no opacity group any more. */
.tn-rig { position: absolute; left: 16px; top: 12px; width: calc(100cqw - 32px); height: 52px; visibility: hidden; }
.rig-l, .rig-r { position: absolute; left: 0; top: 0; width: 52px; height: 52px; transform-origin: 0 0; }
.rig-disc {
  position: absolute; inset: 0; border-radius: 50%;
  background: var(--surface-secondary); box-shadow: var(--outline);
}
.rig-l .rig-disc { clip-path: inset(0 26px 0 0); }
.rig-r .rig-disc { clip-path: inset(0 0 0 26px); }
.rig-r { transform: translate(calc(100cqw - 84px), 0); }           /* x = W−52 */
.rig-band {
  position: absolute; left: 26px; top: 0; height: 52px;
  width: calc(100cqw - 84px);                                       /* W−52: centre to centre */
  transform-origin: 0 0;
  background: linear-gradient(to bottom, #eeeeee 0px 0.25px, #ededed 0.25px 0.75px, #ececec 0.75px 1px, #fafafa 1px 2.5px, #f9f9f9 2.5px 3.75px, #f8f8f8 3.75px 5px, #f7f7f7 5px 6.5px, #f6f6f6 6.5px 8.25px, #f5f5f5 8.25px 51px, #d9d9d9 51px 51.75px, #dadada 51.75px 52px);
}

/* Hit target for search (field, or the circle once location covers the rest) */
.tn-hit {
  position: absolute; left: 16px; top: 12px; width: calc(100cqw - 32px); height: 52px;
  border: 0; padding: 0; margin: 0; background: none; border-radius: 999px; cursor: pointer;
}

/* Circle hit target (collapsed). Swapped by visibility: no layout on flip. */
.tn-hit-c {
  position: absolute; left: 16px; top: 14px; width: 44px; height: 44px; visibility: hidden;
  border: 0; padding: 0; margin: 0; background: none; border-radius: 999px; cursor: pointer;
}

/* Mic x20 y16 */
.tn-mic {
  position: absolute; left: 20px; top: 16px; width: 44px; height: 44px;
  display: grid; place-items: center; border: 0; padding: 0; background: none; border-radius: 999px; cursor: pointer;
}
.tn-mic svg, .tn-icon svg { width: 24px; height: 24px; display: block; }

/* Placeholder: right edge 16+4+44+4 = 68 from the right, y24 */
.tn-placeholder {
  position: absolute; right: 68px; top: 24px; height: 28px;
  display: flex; align-items: center; gap: 4px;
  font-weight: 500; font-size: 15px; line-height: 28px; color: var(--content-tertiary);
  white-space: nowrap; pointer-events: none;
}
.tn-ticker { position: relative; width: 99px; height: 18px; overflow: hidden; direction: rtl; }
.tn-track {
  position: absolute; right: 0; top: -6px; width: 99px;
  display: flex; flex-direction: column; gap: 8px; text-align: right;
  animation: tn-ticker 10250ms infinite;
}
.tn-track span { display: block; line-height: 28px; height: 28px; }
@keyframes tn-ticker {
  0%       { transform: translate3d(0,0,0);      animation-timing-function: linear; }
  7.8049%  { transform: translate3d(0,0,0);      animation-timing-function: cubic-bezier(.22,1,.36,1); }
  20%      { transform: translate3d(0,-36px,0);  animation-timing-function: linear; }
  27.8049% { transform: translate3d(0,-36px,0);  animation-timing-function: cubic-bezier(.22,1,.36,1); }
  40%      { transform: translate3d(0,-72px,0);  animation-timing-function: linear; }
  47.8049% { transform: translate3d(0,-72px,0);  animation-timing-function: cubic-bezier(.22,1,.36,1); }
  60%      { transform: translate3d(0,-108px,0); animation-timing-function: linear; }
  67.8049% { transform: translate3d(0,-108px,0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  80%      { transform: translate3d(0,-144px,0); animation-timing-function: linear; }
  87.8049% { transform: translate3d(0,-144px,0); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  100%     { transform: translate3d(0,-180px,0); }
}

/* Search icon: field slot (right 30, y26) → circle centre (x26, y24) */
.tn-icon { position: absolute; right: 30px; top: 26px; width: 24px; height: 24px; pointer-events: none; }
.tn-icon svg { position: absolute; inset: 0; }
.tn-icon .ic-field { color: #999; }
.tn-icon .ic-btn { color: #000; opacity: 0; }

.tn-hit:focus-visible, .tn-hit-c:focus-visible, .tn-mic:focus-visible, .tn-chip:focus-visible { outline: 2px solid #ed1944; outline-offset: 2px; }

/* ================= Threshold-triggered collapse (no JavaScript) =================
   1. A scroll-driven animation writes a registered integer --c on .tn:
      0 while scrollTop < 32px, 1 from 32px on (steps(1, end) = a hard threshold).
   2. Children read it with a container style query. When --c flips, their
      styles change normally, so ordinary CSS TRANSITIONS run the full 360ms
      collapse / expand on the compositor. Stopping the scroll can't freeze it
      half-way: there are only two states, and the threshold picks one.
   Fallback (no scroll-timeline): header stays expanded, page still scrolls. */
@property --c { syntax: "<integer>"; inherits: true; initial-value: 0; }

.tn {
  --ease: cubic-bezier(.32,.72,0,1);
  --d: 360ms;
  --threshold: 32px;               /* half of the 64px header travel */
}

@supports (animation-timeline: scroll()) {
  .tn {
    animation: k-c steps(1, end) both;
    animation-duration: auto;
    animation-timeline: scroll(root block);
    animation-range: 0px var(--threshold);
  }
  @keyframes k-c { from { --c: 0; } to { --c: 1; } }

  /* Layers moved by transitions, promoted once */
  .tn-bg, .tn-location, .rig-l, .rig-r, .rig-band, .tn-icon, .ic-field, .ic-btn,
  .tn-placeholder, .tn-mic { will-change: transform, opacity; }

  /* ---------- EXPANDED (homePage) + expand timing ---------- */
  .tn-bg, .tn-location { transform: translate3d(0,0,0); transition: transform var(--d) var(--ease); }
  .rig-l { transform: translate(0,0) scale(1); transition: transform var(--d) var(--ease); }
  .rig-r { transform: translate(calc(100cqw - 84px),0) scale(1); transition: transform var(--d) var(--ease); }
  .rig-band { transform: translate(0,0) scale(1,1); transition: transform var(--d) var(--ease); }
  .tn-icon { transform: translate(0,0); transition: transform var(--d) var(--ease); }
  .tn-icon svg { transition: opacity 200ms linear; }
  .tn-placeholder {
    transform: translateX(0); opacity: 1;
    transition: transform var(--d) var(--ease), opacity 200ms linear 220ms;
  }
  .tn-mic { transform: translateX(0); opacity: 1; transition: transform 0s, opacity 200ms linear 220ms; }
  /* statics: field appears exactly when motion ends; circle hides at once */
  .tn-field  { opacity: 1; transition: opacity 0s linear var(--d); }
  .tn-circle { opacity: 0; transition: opacity 0s; }
  /* rig: visible only while moving (visibility flips twice per transition; nothing
     animates per frame on the main thread). Restarts on each state change. */
  .tn-rig { visibility: hidden; animation: k-rig-a calc(var(--d) + 50ms) linear; }
  @keyframes k-rig-a { from, to { visibility: visible; } }
  @keyframes k-rig-b { from, to { visibility: visible; } }

  /* ---------- COLLAPSED (homePageScroll) + collapse timing ---------- */
  @container style(--c: 1) {
    .tn-bg, .tn-location { transform: translate3d(0,-64px,0); }
    .rig-l { transform: translate(0,2px) scale(.846154); }
    .rig-r { transform: translate(0,2px) scale(.846154); }
    .rig-band { transform: translate(-4px,2px) scale(.0001,.846154); }
    .tn-icon { transform: translate(calc(80px - 100cqw), -2px); }
    .tn-icon .ic-field { opacity: 0; transition-delay: 100ms; }
    .tn-icon .ic-btn   { opacity: 1; transition-delay: 100ms; }
    .tn-placeholder {
      opacity: 0; transform: translateX(calc(80px - 100cqw));
      transition: transform var(--d) var(--ease), opacity 80ms linear;
    }
    .tn-mic { opacity: 0; transform: translateX(-200px); transition: opacity 80ms linear, transform 0s linear 80ms; }
    .tn-field  { opacity: 0; transition: opacity 0s; }
    .tn-circle { opacity: 1; transition: opacity 0s linear var(--d); }
    .tn-rig { animation-name: k-rig-b; }
    .tn-hit { visibility: hidden; }
    .tn-hit-c { visibility: visible; }
  }
}

@media (prefers-reduced-motion: reduce) {
  .tn { --d: 1ms; }
  .tn-track { animation: none; }
}
</style>
</head>
<body>
