<!doctype html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Search — suggestion pop-in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <div class="device">
      <div class="device__screen">

        <!-- ===== Search page ===== -->
        <div class="search-page" dir="rtl">
          <header class="search-header">
            <div class="search-header__row">
              <button type="button" class="search-icon-button" aria-label="بازگشت">
                <img src="icons/back.svg" alt="" width="24" height="24">
              </button>

              <label class="search-field">
                <img class="search-field__icon" src="icons/search.svg" alt="" width="24" height="24">
                <!-- The placeholder is required: CSS uses :placeholder-shown to
                     show the chips only while the field is empty. -->
                <input class="search-field__input t-base-medium" type="search" placeholder="جستجو بدون نسخه" aria-label="جستجو بدون نسخه">
              </label>
            </div>
          </header>

          <main class="search-content">
            <!-- RTL reading order, row by row, so the wrap matches Figma.
                 --d is each chip's delay: a fixed "random-looking" order that
                 the optional script below reshuffles on every visit. -->
            <div class="search-suggestions" role="group" aria-label="پیشنهادهای جستجو">
              <button type="button" class="search-chip t-base-small" style="--d: 0.207s">قرص سرما‌خوردگی</button>
              <button type="button" class="search-chip t-base-small" style="--d: 0.253s">قرص آنتی‌هیستامین</button>
              <button type="button" class="search-chip t-base-small" style="--d: 0.148s">قرص استامینوفن</button>
              <button type="button" class="search-chip t-base-small" style="--d: 0.221s">قرص استامینوفن</button>
              <button type="button" class="search-chip t-base-small" style="--d: 0.156s">ویتامین ث</button>
              <button type="button" class="search-chip t-base-small" style="--d: 0.301s">ژلوفن</button>
              <button type="button" class="search-chip t-base-small" style="--d: 0.078s">ب کمپلکس</button>
              <button type="button" class="search-chip t-base-small" style="--d: 0.094s">زینک پلاس</button>
            </div>
          </main>
        </div>
        <!-- ===== /Search page ===== -->

      </div>
    </div>
    <p class="hint">Tap the white area to replay. Type to hide the suggestions, clear the field to bring them back.</p>
  </div>

  <!-- Adds the interactions. Without it the page still shows and animates
       the chips once (using the delays in the HTML). -->
  <script>
    (() => {
      const screen = document.querySelector(".device__screen");
      const group = document.querySelector(".search-suggestions");
      const chips = [...group.querySelectorAll(".search-chip")];
      const input = document.querySelector(".search-field__input");

      // New random order: shuffle, then spread over ~0.22s with a little jitter.
      const shuffleDelays = () => {
        const order = chips.map((_, i) => i).sort(() => Math.random() - 0.5);
        order.forEach((chip, rank) => {
          const delay = 0.06 + (rank / (chips.length - 1)) * 0.22 + Math.random() * 0.05;
          chips[chip].style.setProperty("--d", delay.toFixed(3) + "s");
        });
      };

      // Replay in place: no page load, so it is instant.
      const replay = () => {
        input.value = "";
        input.blur();
        shuffleDelays();
        group.classList.add("is-restarting");
        void group.offsetWidth; // flush styles so the animations restart
        group.classList.remove("is-restarting");
      };

      shuffleDelays();

      // Tapping the white area (anything that is not a control) replays.
      screen.addEventListener("click", (e) => {
        if (!e.target.closest("button, input, label, a")) replay();
      });

      // Clearing the field brings the chips back with a fresh order.
      input.addEventListener("input", () => { if (!input.value) shuffleDelays(); });

      // Tapping a chip puts its text in the search field.
      chips.forEach((chip) => chip.addEventListener("click", () => { input.value = chip.textContent; }));
    })();
  </script>
</body>
</html>
