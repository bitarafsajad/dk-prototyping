/* ---------- Tokens (Figma variables and styles) ---------- */
:root {
  --surface-primary: #ffffff;
  --surface-secondary: #f5f5f5;
  --border-secondary: #d6d6d6;
  --content-primary: #000000;
  --content-tertiary: #737373;
  --shadow-button-outline: inset 0 4px 8px 0 rgba(255, 255, 255, 0.7);
  --font-base: "Digikala", system-ui, sans-serif;

  /* Spring (stiffness 560, damping 20, mass 0.7) as a 21-point linear()
     curve: overshoots to ~1.14x and settles in 460ms. */
  --pop-duration: 460ms;
  --pop-ease: linear(0, 0.009 1.0%, 0.034 2.1%, 0.078 3.3%, 0.140 4.5%, 0.279 6.8%, 0.718 13.2%, 0.837 15.2%, 0.933 17.1%, 1.011 19.0%, 1.072 20.9%, 1.116 22.8%, 1.144 24.9%, 1.159 27.6%, 1.150 30.7%, 1.017 44.2%, 0.992 48.2%, 0.978 52.3%, 0.976 58.6%, 1.003 78.8%, 1);
  --fade-duration: 120ms;
  --fade-ease: cubic-bezier(0.23, 1, 0.32, 1);

  /* Light-only design: stops forced dark modes (Chrome, Samsung Internet)
     from recolouring the page and its controls. */
  color-scheme: only light;
}
/* Browsers without linear() (Chrome < 113, Samsung Internet < 23). */
@supports not (animation-timing-function: linear(0, 1)) {
  :root { --pop-duration: 380ms; --pop-ease: cubic-bezier(0.34, 1.56, 0.64, 1); }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--surface-primary);
  color: var(--content-primary);
  font: 500 15px/28px var(--font-base);
  -webkit-tap-highlight-color: transparent;
}

/* ---------- Page ----------
   A plain white page that fills the screen, so every white area is tappable. */
.search-page {
  min-height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface-primary);
  touch-action: manipulation; /* no tap delay */
}

/* Phones: always full screen width with the 16px safe area on each side.
   Larger screens (tablets, desktop): capped at 390px and centred. */
@media (min-width: 481px) {
  .search-page { max-width: 390px; margin: 0 auto; }
}

/* ---------- Shared surface (back button, search field, chips) ----------
   Fill + 1px stroke drawn inside the box (padding = Figma padding - 1px).
   Figma's inner shadow covers the whole component, stroke and content
   included, so it is drawn on ::after over the border box. */
.surface {
  position: relative;
  margin: 0;
  border: 1px solid var(--border-secondary);
  border-radius: 999px;
  background-color: var(--surface-secondary);
  color: var(--content-primary);
  -webkit-appearance: none;
  appearance: none;
}
.surface::after {
  content: "";
  position: absolute;
  top: -1px; right: -1px; bottom: -1px; left: -1px;
  border-radius: inherit;
  box-shadow: var(--shadow-button-outline);
  pointer-events: none;
}
.icon { display: block; flex: none; width: 24px; height: 24px; }

/* ---------- Header: Title Row ---------- */
.search-header__row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  padding: 8px 16px 12px;
}
.search-icon-button {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  cursor: pointer;
}

  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  height: 44px;
  padding: 0 15px;
  cursor: text;

.search-field__input {
  flex: 1;
  min-width: 0;
  height: 28px;
  margin: 0;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--content-primary);
  font: 500 15px/28px var(--font-base); /* Base/Medium */
  text-align: right;
  outline: none;
  -webkit-appearance: none;
  appearance: none;

.search-icon-button:focus-visible,

/* ---------- Suggestions ---------- */
.search-suggestions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  align-content: center;
  gap: 12px;
  padding: 8px 16px;

/* Empty state only: hidden while the field has text. */
.is-typing .search-suggestions { display: none; }

.search-chip {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  padding: 0 11px;
  font: 500 13px/20px var(--font-base); /* Base/Small */
  white-space: nowrap;
  cursor: pointer;
}
/* false -> true. With JS the script runs these exact animations through the
   Web Animations API (so replays are free); without JS, CSS runs them once.
   Only transform + opacity change: GPU-composited, no layout shift. */
html:not(.js) .search-chip {
  animation:
    chip-pop var(--pop-duration) var(--pop-ease) var(--d, 0s) both,
    chip-fade var(--fade-duration) var(--fade-ease) var(--d, 0s) both;

@keyframes chip-pop  { from { transform: scale(0.1); } to { transform: scale(1); } }
@keyframes chip-fade { from { opacity: 0; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  html:not(.js) .search-chip { animation: chip-fade 200ms ease-out calc(var(--d, 0s) * 0.5) both; }
}

<body>
<div class="search-page" dir="rtl">
    <header class="search-header">
      <div class="search-header__row">
        <button type="button" class="surface search-icon-button" aria-label="بازگشت"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path fill-rule="evenodd" clip-rule="evenodd" d="M13.9289 4.92896L21 12L13.9289 19.0711L12.5147 17.6569L17.17 13L4 13V11L17.17 11L12.5147 6.34317L13.9289 4.92896Z" fill="black"/></svg></button>
        <label class="surface search-field">
          <svg class="icon search-field__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.5 2C15.1944 2 19 5.80558 19 10.5C19 12.3588 18.4034 14.0782 17.3912 15.4772L21.682 19.7678L20.2678 21.182L16.0359 16.9503C14.5487 18.2279 12.6145 19 10.5 19C5.80558 19 2 15.1944 2 10.5C2 5.80558 5.80558 2 10.5 2ZM10.5 4C6.91015 4 4 6.91015 4 10.5C4 14.0899 6.91015 17 10.5 17C14.0899 17 17 14.0899 17 10.5C17 6.91015 14.0899 4 10.5 4Z" fill="#737373"/></svg>
          <input class="search-field__input" type="search" placeholder="جستجو بدون نسخه" aria-label="جستجو بدون نسخه" autocomplete="off" enterkeyhint="search">
        </label>
      </div>
    </header>
    <main class="search-content">
      <!-- RTL reading order, row by row, so the wrap matches Figma.
           --d = each chip's delay (shuffled by the script on every visit). -->
      <div class="search-suggestions" role="group" aria-label="پیشنهادهای جستجو">
        <button type="button" class="surface search-chip" style="--d:.207s">قرص سرما‌خوردگی</button>
        <button type="button" class="surface search-chip" style="--d:.253s">قرص آنتی‌هیستامین</button>
        <button type="button" class="surface search-chip" style="--d:.148s">قرص استامینوفن</button>
        <button type="button" class="surface search-chip" style="--d:.221s">قرص استامینوفن</button>
        <button type="button" class="surface search-chip" style="--d:.156s">ویتامین ث</button>
        <button type="button" class="surface search-chip" style="--d:.301s">ژلوفن</button>
        <button type="button" class="surface search-chip" style="--d:.078s">ب کمپلکس</button>
        <button type="button" class="surface search-chip" style="--d:.094s">زینک پلاس</button>
      </div>
    </main>
</div>
<script>
(function () {
  var page = document.querySelector(".search-page");
  var input = page.querySelector(".search-field__input");
  var chips = Array.prototype.slice.call(page.querySelectorAll(".search-chip"));
  var canAnimate = typeof Element.prototype.animate === "function";
  if (!canAnimate) { document.documentElement.className = ""; return; } // CSS fallback

  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var supportsLinear = window.CSS && CSS.supports && CSS.supports("animation-timing-function", "linear(0, 1)");
  // Spring (stiffness 560, damping 20, mass 0.7) as linear(); bezier on old browsers.
  var POP = supportsLinear
    ? { duration: 460, easing: "linear(0, 0.009 1.0%, 0.034 2.1%, 0.078 3.3%, 0.140 4.5%, 0.279 6.8%, 0.718 13.2%, 0.837 15.2%, 0.933 17.1%, 1.011 19.0%, 1.072 20.9%, 1.116 22.8%, 1.144 24.9%, 1.159 27.6%, 1.150 30.7%, 1.017 44.2%, 0.992 48.2%, 0.978 52.3%, 0.976 58.6%, 1.003 78.8%, 1)" }
    : { duration: 380, easing: "cubic-bezier(0.34, 1.56, 0.64, 1)" };
  var FADE = reduce
    ? { duration: 200, easing: "ease-out" }
    : { duration: 120, easing: "cubic-bezier(0.23, 1, 0.32, 1)" };

  // Random order spread over ~0.22s with a little jitter (ms).
  function randomDelays() {
    var order = chips.map(function (_, i) { return i; });
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = order[i]; order[i] = order[j]; order[j] = t;
    }
    var d = [];
    order.forEach(function (chip, rank) {
      var s = 60 + (rank / (chips.length - 1)) * 220 + Math.random() * 50;
      d[chip] = reduce ? s * 0.5 : s;
    });
    return d;
  }

  // Created once, then only rewound: replaying costs no style or layout work.
  var anims = [];
  function pop() {
    var d = randomDelays();
    chips.forEach(function (c, i) {
      if (!anims[i]) {
        var fill = { fill: "both", delay: d[i] };
        anims[i] = [c.animate([{ opacity: 0 }, { opacity: 1 }], Object.assign({}, FADE, fill))];
        if (!reduce) anims[i].push(c.animate([{ transform: "scale(0.1)" }, { transform: "scale(1)" }], Object.assign({}, POP, fill)));
      } else {
        anims[i].forEach(function (a) {
          a.effect.updateTiming({ delay: d[i] });
          a.currentTime = 0;
          a.play();
        });
      }
    });
  }
  pop(); // first entry

  function clearAndShow() {
    input.value = "";
    page.classList.remove("is-typing");
  }

  // Tap on any white area (not a control) replays.
  document.addEventListener("click", function (e) {
    if (e.target.closest("button, input, label")) return;
    input.blur();
    if (input.value) clearAndShow();
    pop();
  });

  // Hide suggestions while typing; pop them back in when the field is cleared.
  input.addEventListener("input", function () {
    var typing = input.value !== "";
    page.classList.toggle("is-typing", typing);
    if (!typing) pop();
  });

  // Tapping a chip puts its text in the field.
  chips.forEach(function (c) {
    c.addEventListener("click", function () {
      input.value = c.textContent;
      page.classList.add("is-typing");
    });
  });
})();
</script>
